name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare app folder and build APK
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/font app/src/main/java/com/loboro
          mv AndroidManifest.xml app/src/main/ || true
          mv *.kt app/src/main/java/com/loboro/ || true
          mv colors.xml strings.xml themes.xml backup_rules.xml data_extraction_rules.xml app/src/main/res/values/ || true
          mv *.ttf app/src/main/res/font/ || true
          mv ic_launcher*.png loboro_launcher_icon*.png app/src/main/res/mipmap-xxxhdpi/ || true
          mv ic_launcher*.xml ic_loboro_notification.xml app/src/main/res/drawable/ || true
          if [ -f build.gradle.kts ]; then mv build.gradle.kts app/build.gradle.kts; fi
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          printf 'pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = "LOBORO"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins {\n  id("com.android.application") version "8.5.0" apply false\n  id("org.jetbrains.kotlin.android") version "2.0.0" apply false\n  id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false\n}\n' > build.gradle.kts
          printf 'plugins {\n  id("com.android.application")\n  id("org.jetbrains.kotlin.android")\n  id("org.jetbrains.kotlin.plugin.compose")\n}\nandroid {\n  namespace = "com.loboro"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.loboro"\n    minSdk = 24\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  buildFeatures {\n    compose = true\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = "17"\n  }\n}\ndependencies {\n  implementation("androidx.core:core-ktx:1.13.1")\n  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")\n  implementation("androidx.activity:activity-compose:1.9.2")\n  implementation("androidx.navigation:navigation-compose:2.8.2")\n  implementation(platform("androidx.compose:compose-bom:2024.09.00"))\n  implementation("androidx.compose.ui:ui")\n  implementation("androidx.compose.ui:ui-graphics")\n  implementation("androidx.compose.ui:ui-tooling-preview")\n  implementation("androidx.compose.material3:material3")\n  implementation("androidx.compose.material:material-icons-extended")\n  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")\n  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")\n  debugImplementation("androidx.compose.ui:ui-tooling")\n  debugImplementation("androidx.compose.ui:ui-test-manifest")\n  testImplementation("junit:junit:4.13.2")\n  androidTestImplementation("androidx.test.ext:junit:1.2.1")\n  androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")\n}\n' > app/build.gradle.kts
          [ -f ./gradlew ] || gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loboro-debug-apk
          path: "**/*.apk"
