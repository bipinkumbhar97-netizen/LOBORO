name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare app folder and catalog
        run: |
          mkdir -p gradle app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/font app/src/main/java/com/loboro
          mv AndroidManifest.xml app/src/main/ || true
          mv *.kt app/src/main/java/com/loboro/ || true
          mv colors.xml strings.xml themes.xml backup_rules.xml data_extraction_rules.xml app/src/main/res/values/ || true
          mv *.ttf app/src/main/res/font/ || true
          mv ic_launcher*.png loboro_launcher_icon*.png app/src/main/res/mipmap-xxxhdpi/ || true
          mv ic_launcher*.xml ic_loboro_notification.xml app/src/main/res/drawable/ || true
          if [ -f build.gradle.kts ]; then mv build.gradle.kts app/build.gradle.kts; fi
          echo 'rootProject.name = "LOBORO"' > settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          printf '[versions]\nagp = "8.5.0"\nkotlin = "2.0.0"\n[plugins]\nandroid-application = { id = "com.android.application", version.ref = "agp" }\nkotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }\nksp = { id = "com.google.devtools.ksp", version = "2.0.0-1.0.24" }\nsecrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }\ngoogle-services = { id = "com.google.gms.google-services", version = "4.4.2" }\n' > gradle/libs.versions.toml
          printf 'plugins {\n  alias(libs.plugins.android.application) apply false\n  alias(libs.plugins.kotlin.compose) apply false\n  alias(libs.plugins.ksp) apply false\n  alias(libs.plugins.secrets) apply false\n  alias(libs.plugins.google.services) apply false\n}\n' > build.gradle.kts

      - name: Build Debug APK
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loboro-debug-apk
          path: "**/*.apk"
