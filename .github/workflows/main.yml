name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Organize files and build APK
        run: |
          mkdir -p gradle app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/font app/src/main/java/com/loboro
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv *.kt app/src/main/java/com/loboro/ 2>/dev/null || true
          mv colors.xml strings.xml themes.xml backup_rules.xml data_extraction_rules.xml app/src/main/res/values/ 2>/dev/null || true
          mv *.ttf app/src/main/res/font/ 2>/dev/null || true
          mv ic_launcher*.png loboro_launcher_icon*.png app/src/main/res/mipmap-xxxhdpi/ 2>/dev/null || true
          mv ic_launcher*.xml ic_loboro_notification.xml app/src/main/res/drawable/ 2>/dev/null || true

          if [ -f build.gradle.kts ]; then
            mv build.gradle.kts app/build.gradle.kts
          fi

          if [ ! -f gradle/libs.versions.toml ]; then
            cat << 'EOF' > gradle/libs.versions.toml
[versions]
agp = "8.5.0"
kotlin = "2.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.0-1.0.24" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
EOF
          fi

          cat << 'EOF' > build.gradle.kts
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.secrets) apply false
    alias(libs.plugins.google.services) apply false
}
EOF

          [ -f settings.gradle.kts ] || printf 'rootProject.name = "LOBORO"\ninclude(":app")\n' > settings.gradle.kts

          if [ ! -f app/build.gradle.kts ]; then
            cat << 'EOF' > app/build.gradle.kts
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.loboro"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.loboro"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.activity:activity-compose:1.9.2")
    implementation(platform("androidx.compose:compose-bom:2024.09.00"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.material3:material3")
}
EOF
          fi

          [ -f ./gradlew ] || gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loboro-debug-apk
          path: "**/*.apk"
