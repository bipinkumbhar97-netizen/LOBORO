name: Build LOBORO Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Prepare app folder and build APK
        run: |
          set -e
          mkdir -p app/src/main/res/values \
                   app/src/main/res/xml \
                   app/src/main/res/drawable \
                   app/src/main/res/mipmap-xxxhdpi \
                   app/src/main/java/com/loboro

          # Move data_extraction_rules.xml from values/ to xml/ if present
          if [ -f "app/src/main/res/values/data_extraction_rules.xml" ]; then
            mkdir -p app/src/main/res/xml
            mv app/src/main/res/values/data_extraction_rules.xml app/src/main/res/xml/data_extraction_rules.xml
          fi

          # Safely move launcher icon only if matching file(s) exist
          shopt -s nullglob
          icons=(loboro_launcher_icon*.png app/src/main/res/drawable/loboro_launcher_icon*.png)
          if [ ${#icons[@]} -gt 0 ]; then
            cp "${icons[@]}" app/src/main/res/mipmap-xxxhdpi/
          else
            echo "No custom loboro_launcher_icon*.png found; continuing with existing resources."
          fi
          shopt -u nullglob

          ./gradlew assembleDebug --stacktrace
