name: Build LOBORO Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare app structure and build APK
        run: |
          set -e
          mkdir -p app/src/main/res/values \
                   app/src/main/res/xml \
                   app/src/main/res/drawable \
                   app/src/main/res/mipmap-xxxhdpi \
                   app/src/main/java/com/loboro

          if [ -f "app/src/main/res/values/data_extraction_rules.xml" ]; then
            mv app/src/main/res/values/data_extraction_rules.xml app/src/main/res/xml/
          fi

          shopt -s nullglob
          icons=(loboro_launcher_icon*.png app/src/main/res/drawable/loboro_launcher_icon*.png)
          if [ "${#icons[@]}" -gt 0 ]; then
            cp "${icons[0]}" app/src/main/res/mipmap-xxxhdpi/
          else
            echo "No custom loboro_launcher_icon.png found; continuing with existing resources."
          fi
          shopt -u nullglob

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.25" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LOBORO"
          include(":app")
          EOF

          if [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle.kts
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
                id("org.jetbrains.kotlin.plugin.compose")
                id("com.google.devtools.ksp")
            }

            android {
                namespace = "com.loboro"
                compileSdk = 35

                defaultConfig {
                    applicationId = "com.loboro"
                    minSdk = 24
                    targetSdk = 35
                    versionCode = 1
                    versionName = "1.0"
                }

                buildTypes {
                    release {
                        isMinifyEnabled = false
                        proguardFiles(
                            getDefaultProguardFile("proguard-android-optimize.txt"),
                            "proguard-rules.pro"
                        )
                    }
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }

                kotlinOptions {
                    jvmTarget = "17"
                }

                buildFeatures {
                    compose = true
                }
            }

            dependencies {
                implementation("androidx.core:core-ktx:1.15.0")
                implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
                implementation("androidx.activity:activity-compose:1.9.3")
                implementation(platform("androidx.compose:compose-bom:2024.11.00"))
                implementation("androidx.compose.ui:ui")
                implementation("androidx.compose.ui:ui-graphics")
                implementation("androidx.compose.ui:ui-tooling-preview")
                implementation("androidx.compose.material3:material3")
                debugImplementation("androidx.compose.ui:ui-tooling")
            }
            EOF
          fi

          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: loboro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
